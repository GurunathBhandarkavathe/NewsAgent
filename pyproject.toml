[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsagent"
version = "0.1.0"
description = "Samachar Bharat local-first India trending news Instagram carousel agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "Flask>=3.0",
  "Pillow>=10.0",
  "python-dotenv>=1.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
newsagent = "newsagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
