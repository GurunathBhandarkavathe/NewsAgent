name: Cron Heartbeat

on:
  workflow_dispatch:
  schedule:
    # Diagnostic schedule. This does not publish anything.
    # Use a short cadence so GitHub scheduler activity is easy to confirm.
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Show cron context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          date -u
