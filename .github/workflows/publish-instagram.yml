name: Publish Instagram Posts

on:
  workflow_dispatch:
    inputs:
      burst_count:
        description: "Manual test only: number of one-post drafts to publish in this run"
        required: false
        default: "1"
      burst_delay_seconds:
        description: "Manual test only: seconds to wait between draft generations"
        required: false
        default: "0"
  schedule:
    # TEMP TEST MODE: GitHub Actions' shortest supported schedule is every 5 minutes.
    # Offset from :00/:05/:10 to reduce GitHub scheduler delay/drop risk.
    # Revert to: 30 0,3,6,9,12,15,18,21 * * *
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: samachar-bharat-instagram
  cancel-in-progress: false

env:
  BRAND_NAME: Samachar Bharat
  BRAND_HANDLE: "@smachar.bh"
  BRAND_TAGLINE: Bharat in 5 slides. Every 3 hours.
  NEWSAGENT_DATA_DIR: data
  NEWSAGENT_ASSETS_DIR: public-assets
  NEWSAGENT_SESSION_PATH: data/session-store.json
  # TEMP TEST MODE: publish one story per run so scheduled testing does not flood the page.
  # Revert to DRAFT_MIN_ITEMS=4 and DRAFT_MAX_ITEMS=5 after testing.
  DRAFT_MIN_ITEMS: "1"
  DRAFT_MAX_ITEMS: "1"
  POST_FORMAT: separate_posts
  ARTICLE_DETAIL_ENRICHMENT: "true"
  IMAGE_POLICY: article_images
  REQUIRE_REAL_IMAGES: "true"
  META_GRAPH_VERSION: v26.0
  META_API_HOST: ${{ secrets.META_API_HOST }}
  INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
  META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore JSON session store
        uses: actions/cache@v4
        with:
          path: data/session-store.json
          key: newsagent-session-${{ github.run_id }}
          restore-keys: |
            newsagent-session-

      - name: Install app
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --force-reinstall .

      - name: Verify publish mode
        run: |
          echo "workflow_commit=$(git rev-parse --short HEAD)"
          python - <<'PY'
          from newsagent.config import load_config
          import newsagent.publisher

          config = load_config()
          print(f"installed_publisher={newsagent.publisher.__file__}")
          print(f"post_format={config.post_format}")
          if config.post_format != "separate_posts":
              raise SystemExit("POST_FORMAT must be separate_posts for this workflow")
          PY

      - name: Create draft batch
        id: drafts
        env:
          REQUESTED_BURST_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.burst_count || '1' }}
          REQUESTED_BURST_DELAY_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.burst_delay_seconds || '0' }}
        run: |
          count="$REQUESTED_BURST_COUNT"
          delay="$REQUESTED_BURST_DELAY_SECONDS"

          case "$count" in
            ''|*[!0-9]*) count=1 ;;
          esac
          case "$delay" in
            ''|*[!0-9]*) delay=0 ;;
          esac

          if [ "$count" -lt 1 ]; then count=1; fi
          if [ "$count" -gt 5 ]; then count=5; fi
          if [ "$delay" -gt 300 ]; then delay=300; fi

          : > data/draft-ids.txt
          for i in $(seq 1 "$count"); do
            draft_id_file="data/latest-draft-id-${i}.txt"
            newsagent run-once --draft-id-file "$draft_id_file"
            draft_id="$(cat "$draft_id_file")"
            if [ -n "$draft_id" ]; then
              echo "$draft_id" >> data/draft-ids.txt
            fi
            if [ "$i" -lt "$count" ] && [ "$delay" -gt 0 ]; then
              sleep "$delay"
            fi
          done

          draft_count="$(wc -l < data/draft-ids.txt | tr -d ' ')"
          echo "draft_count=$draft_count" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: steps.drafts.outputs.draft_count != '0'
        uses: actions/configure-pages@v5

      - name: Upload generated assets to Pages
        if: steps.drafts.outputs.draft_count != '0'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-assets

      - name: Deploy generated assets to Pages
        if: steps.drafts.outputs.draft_count != '0'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish exact generated drafts
        if: steps.drafts.outputs.draft_count != '0'
        run: |
          while IFS= read -r draft_id; do
            if [ -n "$draft_id" ]; then
              newsagent publish-latest \
                --draft-id "$draft_id" \
                --public-asset-base-url "${{ steps.deployment.outputs.page_url }}"
            fi
          done < data/draft-ids.txt

      - name: No fresh draft
        if: steps.drafts.outputs.draft_count == '0'
        run: echo "No fresh draft was generated, so nothing was published."
