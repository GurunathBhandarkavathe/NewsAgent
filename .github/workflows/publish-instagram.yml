name: Publish Instagram Posts

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # TEMP TEST MODE: every 10 minutes, offset away from the top of the hour.
    # Revert to: 30 0,3,6,9,12,15,18,21 * * *
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: samachar-bharat-instagram
  cancel-in-progress: false

env:
  BRAND_NAME: Samachar Bharat
  BRAND_HANDLE: "@smachar.bh"
  BRAND_TAGLINE: Bharat in 5 slides. Every 3 hours.
  NEWSAGENT_DATA_DIR: data
  NEWSAGENT_ASSETS_DIR: public-assets
  NEWSAGENT_SESSION_PATH: data/session-store.json
  # TEMP TEST MODE: publish one story per run so scheduled testing does not flood the page.
  # Revert to DRAFT_MIN_ITEMS=4 and DRAFT_MAX_ITEMS=5 after testing.
  DRAFT_MIN_ITEMS: "1"
  DRAFT_MAX_ITEMS: "1"
  POST_FORMAT: separate_posts
  ARTICLE_DETAIL_ENRICHMENT: "true"
  IMAGE_POLICY: article_images
  REQUIRE_REAL_IMAGES: "true"
  META_GRAPH_VERSION: v26.0
  META_API_HOST: ${{ secrets.META_API_HOST }}
  INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
  META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore JSON session store
        uses: actions/cache@v4
        with:
          path: data/session-store.json
          key: newsagent-session-${{ github.run_id }}
          restore-keys: |
            newsagent-session-

      - name: Install app
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --force-reinstall .

      - name: Verify publish mode
        run: |
          echo "workflow_commit=$(git rev-parse --short HEAD)"
          python - <<'PY'
          from newsagent.config import load_config
          import newsagent.publisher

          config = load_config()
          print(f"installed_publisher={newsagent.publisher.__file__}")
          print(f"post_format={config.post_format}")
          if config.post_format != "separate_posts":
              raise SystemExit("POST_FORMAT must be separate_posts for this workflow")
          PY

      - name: Create one draft
        id: draft
        run: |
          newsagent run-once --draft-id-file data/latest-draft-id.txt
          echo "draft_id=$(cat data/latest-draft-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: steps.draft.outputs.draft_id != ''
        uses: actions/configure-pages@v5

      - name: Upload generated assets to Pages
        if: steps.draft.outputs.draft_id != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-assets

      - name: Deploy generated assets to Pages
        if: steps.draft.outputs.draft_id != ''
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish exact generated draft
        if: steps.draft.outputs.draft_id != ''
        run: |
          newsagent publish-latest \
            --draft-id-file data/latest-draft-id.txt \
            --public-asset-base-url "${{ steps.deployment.outputs.page_url }}"

      - name: No fresh draft
        if: steps.draft.outputs.draft_id == ''
        run: echo "No fresh draft was generated, so nothing was published."
